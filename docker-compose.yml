services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Reach an Ollama server running on the host machine
      OLLAMA_API_BASE: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data            # sample mails, context notes, SQLite DB, Chroma index
      - ./secrets:/app/secrets:ro   # Gmail OAuth files (optional)
      - hf-cache:/app/.hf           # embedding model download, kept between restarts

volumes:
  hf-cache:
